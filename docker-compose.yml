# Brokers for the HostLoom transport integration tests. Nothing else in the repository needs
# them: the unit suite is deterministic and in-process, and these tests skip themselves when the
# ports are closed.
#
#   docker compose up -d
#   dotnet test tests/HostLoom.IntegrationTests/HostLoom.IntegrationTests.csproj -c Release
#   docker compose down -v
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: hostloom-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      # check_running alone reports healthy before the AMQP listener accepts connections, which
      # would let the suite start against a broker that then refuses the first request.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka:
    image: apache/kafka:3.9.0
    container_name: hostloom-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single node: every replication factor must be 1 or topic creation hangs.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # The transport creates request, response, and topic names on demand.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      # Without this a fresh group waits three seconds before its first assignment, which is pure
      # latency in every test that starts a consumer.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 18
      start_period: 20s
