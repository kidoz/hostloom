name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:

# Least privilege by default. Only the publish job below can mint an OIDC token or write an
# attestation, and it runs no restore, build, or test code: everything that executes third-party
# packages runs in the build job, which can read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      publish_nuget: ${{ steps.release.outputs.publish_nuget }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Validate release tag and changelog
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "release" ]; then
            echo "Manual dispatch: skipping tag validation; packages are versioned 0.0.0-manual and never published."
            echo "publish_nuget=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ "${GITHUB_REF_NAME}" == websocket-client-v* ]]; then
            echo "WebSocket client release: skipping NuGet publication for the independent browser-package tag stream."
            echo "publish_nuget=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '${tag}' is not strict semver. Expected vMAJOR.MINOR.PATCH with an optional -prerelease suffix."
            exit 1
          fi
          version="${tag#v}"
          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section for release tag '${tag}'."
            exit 1
          fi
          echo "Release tag '${tag}' is well-formed and CHANGELOG.md documents ${version}."
          echo "publish_nuget=true" >> "${GITHUB_OUTPUT}"

  build:
    needs: validate
    if: needs.validate.outputs.publish_nuget == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      version: ${{ steps.version.outputs.version }}

    permissions:
      contents: read

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: 1

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore HostLoom.slnx

      - name: Resolve package version from release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-manual"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build HostLoom.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Start brokers
        run: docker compose up -d --wait

      - name: Test
        # HOSTLOOM_REQUIRE_BROKERS turns an unreachable broker into a failure instead of a skip.
        # Without it the release would publish having proved that the RabbitMQ and Kafka adapters
        # compile, while reporting a green suite that never touched either broker.
        env:
          HOSTLOOM_REQUIRE_BROKERS: "1"
        run: dotnet test HostLoom.slnx --configuration Release --no-build --no-restore

      - name: Verify Valkey TLS, ACL and restart recovery
        run: python3 scripts/test-valkey-deployment.py --no-build

      - name: Verify Valkey Native AOT
        run: |
          dotnet publish examples/HostLoom.Examples.ValkeyAot -c Release -r linux-x64 -o artifacts/valkey-aot -p:Version=${{ steps.version.outputs.version }}
          artifacts/valkey-aot/HostLoom.Examples.ValkeyAot

      - name: Stop brokers
        if: always()
        run: docker compose down -v

      - name: Pack
        run: dotnet pack HostLoom.slnx --configuration Release --no-build --no-restore --output artifacts/packages -p:Version=${{ steps.version.outputs.version }}

      - name: Verify packed composition consumer
        run: python3 scripts/verify-composition-package.py --packages artifacts/packages --version ${{ steps.version.outputs.version }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hostloom-release-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget

    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hostloom-release-packages
          path: artifacts/packages

      - name: Check the publish list against the packed packages
        shell: bash
        run: |
          set -euo pipefail
          # Every packable project must appear in packages.txt below, and every listed package must
          # have been packed. Both directions are checked before the first push, because a push
          # that fails part-way leaves a release published only in part.
          cat > packages.txt <<'LIST'
          HostLoom.Pipelines
          HostLoom.Logging
          HostLoom
          HostLoom.Pipelines.DependencyInjection
          HostLoom.Pipelines.Testing
          HostLoom.Transport.InMemory
          HostLoom.Transport.RabbitMq
          HostLoom.Transport.Kafka
          HostLoom.AspNetCore.WebSockets
          HostLoom.AspNetCore.WebSockets.Testing
          HostLoom.Analyzers
          HostLoom.Diagnostics
          HostLoom.Composition
          HostLoom.Composition.Testing
          HostLoom.Mapping
          HostLoom.Mapping.DependencyInjection
          HostLoom.Mapping.Testing
          HostLoom.Caching
          HostLoom.Caching.DependencyInjection
          HostLoom.Caching.Testing
          HostLoom.Caching.Pipelines
          HostLoom.Locking
          HostLoom.Locking.DependencyInjection
          HostLoom.Locking.Testing
          HostLoom.Locking.Pipelines
          HostLoom.Scheduling
          HostLoom.Scheduling.DependencyInjection
          HostLoom.Scheduling.Locking
          HostLoom.Scheduling.Testing
          HostLoom.Scheduling.Leadership
          HostLoom.Leadership
          HostLoom.Leadership.DependencyInjection
          HostLoom.Leadership.Testing
          HostLoom.Redis
          HostLoom.Valkey
          LIST

          missing=()
          for package_file in artifacts/packages/*.nupkg; do
            packed="$(basename "${package_file}" ".${PACKAGE_VERSION}.nupkg")"
            grep -qxF "${packed}" packages.txt || missing+=("${packed}")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Packed but not in the publish list: ${missing[*]}"
            exit 1
          fi
          unpacked=()
          while read -r package_id; do
            [ -f "artifacts/packages/${package_id}.${PACKAGE_VERSION}.nupkg" ] || unpacked+=("${package_id}")
          done < packages.txt
          if [ ${#unpacked[@]} -gt 0 ]; then
            echo "::error::In the publish list but not packed: ${unpacked[*]}"
            exit 1
          fi
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}

      - name: Attest package provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        shell: bash
        run: |
          set -euo pipefail
          # --skip-duplicate lets a rerun finish a release that stopped part-way.
          while read -r package_id; do
            dotnet nuget push "artifacts/packages/${package_id}.${PACKAGE_VERSION}.nupkg" \
              --api-key "${NUGET_API_KEY}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done < packages.txt
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
